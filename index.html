/* hand-drawn frame */
.frame{
  border:5px solid var(--olive);
  border-radius:14px 22px 12px 26px / 24px 12px 22px 14px;
  background:#fffdf7;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:1100px;margin:0 auto;padding:14px 18px 4px;
}
h1{font-family:var(--hand);font-weight:400;font-size:clamp(1.7rem,3.5vw,2.5rem);margin:0;letter-spacing:.5px}
.top-right{display:flex;align-items:center;gap:10px}
.stars{font-size:1.5rem;letter-spacing:2px;white-space:nowrap}
.stars .off{filter:grayscale(1);opacity:.25}
.icon-btn{
  font:inherit;font-size:1.4rem;width:52px;height:52px;cursor:pointer;
  border:3px solid var(--olive);border-radius:50% 46% 52% 48%;background:#fffdf7;
}
.icon-btn:focus-visible,.key:focus-visible,.big-btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

main{
  max-width:1100px;margin:0 auto;padding:10px 18px 24px;
  display:grid;grid-template-columns:minmax(260px,5fr) 7fr;gap:22px;align-items:stretch;
}
/* ---------- stage ---------- */
.stage{
  position:relative;overflow:hidden;min-height:640px;
  background:linear-gradient(var(--sky) 0 86%, #e7d6b3 86% 100%);
}
.stage::after{ /* floor line */
  content:"";position:absolute;left:0;right:0;bottom:14%;height:4px;
  background:var(--olive);opacity:.55;border-radius:4px;
}
.cloud{position:absolute;font-size:2.6rem;opacity:.55}
.rig{
  position:absolute;left:50%;bottom:calc(14% - 6px);
  transform:translate(-50%, calc(var(--lift) * -1px));
  transition:transform .9s cubic-bezier(.3,1.4,.5,1);
  display:flex;flex-direction:column;align-items:center;
  --lift:150;
}
.rig.bounce{animation:hop .5s ease 3}
@keyframes hop{50%{margin-bottom:28px}}
.balloons{width:230px;height:200px;overflow:visible;margin-bottom:-42px;position:relative;z-index:0}
.balloon{transform-box:fill-box;transform-origin:center;transition:transform .25s, opacity .25s}
.balloon.popped{transform:scale(1.6);opacity:0}
.string.popped{opacity:0;transition:opacity .2s}
.teacher{width:clamp(120px,13vw,150px);height:auto;position:relative;z-index:1;
  filter:drop-shadow(0 4px 0 rgba(47,42,38,.12))}
.pop-word{
  position:absolute;font-family:var(--hand);font-size:2rem;color:var(--red);
  pointer-events:none;animation:popword .7s ease-out forwards;z-index:3
}
@keyframes popword{from{transform:scale(.4);opacity:1}to{transform:scale(1.4) translateY(-20px);opacity:0}}
.lives{position:absolute;top:12px;left:14px;font-family:var(--hand);font-size:1.3rem;
  background:#fffdf7cc;padding:2px 12px;border-radius:12px}

/* ---------- play area ---------- */
.play{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px}
.card{
  width:min(300px,70vw);aspect-ratio:1;overflow:hidden;padding:0;
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card.enter{animation:cardin .45s ease-out}
@keyframes cardin{from{transform:rotate(-6deg) scale(.85);opacity:0}}
.prompt{font-family:var(--hand);font-size:1.6rem;margin:0;min-height:2.2rem;text-align:center}
.word{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 28px;min-height:70px}
.slot{
  width:clamp(30px,4.2vw,46px);height:clamp(50px,6vw,62px);
  border-bottom:5px solid var(--ink);border-radius:0 0 4px 4px;
  font-family:var(--hand);font-size:clamp(2.2rem,4.5vw,3rem);line-height:1;
  display:flex;align-items:flex-end;justify-content:center;text-transform:lowercase;
}
.part{display:flex;gap:8px}
.slot.shown{animation:letterin .3s ease-out}
.slot.missed{color:var(--red)}
@keyframes letterin{from{transform:translateY(-14px);opacity:0}}
.word.won .slot{color:var(--green)}

.say-row{display:flex;align-items:center;gap:12px;min-height:60px}
.big-btn{
  font-family:var(--hand);font-size:1.7rem;cursor:pointer;padding:6px 26px;color:var(--ink);
  border:4px solid var(--olive);background:var(--yellow);
  border-radius:18px 12px 20px 10px / 12px 20px 10px 18px;
}
.big-btn.blue{background:#cfe0f5}
.hidden{display:none !important}
.say{font-family:var(--hand);font-size:1.8rem;color:var(--blue);margin:0}

.keyboard{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.krow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.key{
  font-family:var(--text);font-weight:700;font-size:1.35rem;text-transform:lowercase;
  width:clamp(40px,5.4vw,54px);height:clamp(48px,6vw,56px);cursor:pointer;color:var(--ink);
  border:3px solid var(--ink);background:#fffdf7;
  border-radius:10px 13px 9px 12px / 12px 9px 13px 10px;
  box-shadow:0 3px 0 var(--ink);transition:transform .08s;
}
.key:active{transform:translateY(3px);box-shadow:none}
.key.good{background:#cfe6b3;border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.key.bad{background:#e6e1d8;color:var(--grey);border-color:var(--grey);box-shadow:none}
.key:disabled{cursor:default}


/* warm-up */
.warm{position:fixed;inset:0;z-index:20;overflow:auto;background:inherit;background-color:var(--paper);
  display:flex;flex-direction:column;align-items:center;padding:18px 16px 30px}
.warm h2{font-family:var(--hand);font-weight:400;font-size:clamp(2rem,4.5vw,2.8rem);margin:4px 0 2px}
.warm .hint{font-size:1.25rem;margin:0 0 14px}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(820px,100%,max(320px,calc((100vh - 380px) / .75)))}
.wcard{cursor:pointer;padding:0;overflow:hidden;font:inherit;color:inherit;text-align:center;
  transition:transform .15s}
.wcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.wcard span{display:block;font-family:var(--hand);font-size:clamp(1.2rem,2.6vw,1.8rem);padding:2px 4px 6px;white-space:nowrap}
.wcard.playing{transform:scale(1.05) rotate(-1.5deg);border-color:var(--blue)}
.wcard:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px}
/* end screen */
.overlay{
  position:fixed;inset:0;background:rgba(251,246,234,.92);
  display:flex;align-items:center;justify-content:center;z-index:10;padding:20px
}
.end{padding:30px 40px;text-align:center;max-width:460px}
.end h2{font-family:var(--hand);font-weight:400;font-size:3rem;margin:0 0 6px}
.end p{font-size:1.3rem;margin:6px 0 18px}
.end img{width:130px}
.end .stars{font-size:2rem;margin-bottom:14px}

@media (max-width:760px){
  main{grid-template-columns:1fr}
  .stage{min-height:480px}
  header{flex-wrap:wrap}
  .stars{font-size:1.1rem;letter-spacing:0}
  .say-row{flex-wrap:wrap;justify-content:center}
  .balloons{width:180px;height:160px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

const MAX_MISS = 6;
const LIFT_STEP = 14;               // px per balloon
const COLORS = ["#d9534a","#3f7cc4","#f2c230","#6f9a3e","#9b6fc4","#e98a3b"];

const $ = id => document.getElementById(id);
let order = [], idx = 0, word = "", guessed = new Set(), misses = 0, done = false;
let results = [], soundOn = true;

/* ---------- balloons ---------- */
function drawBalloons(){
  const pos = [[40,70],[85,38],[130,30],[178,62],[62,122],[160,118]];
  const knot = [115,196];
  let s = "";
  pos.forEach(([x,y],i)=>{
    s += `<path class="string" data-i="${i}" d="M${x} ${y+30} Q ${(x+knot[0])/2+8} ${(y+knot[1])/2} ${knot[0]} ${knot[1]}" stroke="#2f2a26" stroke-width="1.6" fill="none"/>`;
  });
  pos.forEach(([x,y],i)=>{
    const c = COLORS[i];
    s += `<g class="balloon" data-i="${i}">
      <ellipse cx="${x}" cy="${y}" rx="23" ry="28" fill="${c}" stroke="#2f2a26" stroke-width="2.4"/>
      <path d="M${x-4} ${y+28} l4 6 l4 -6 z" fill="${c}" stroke="#2f2a26" stroke-width="1.6"/>
      <path d="M${x-12} ${y-12} q4 -9 12 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
      <path d="M${x-18} ${y+4} l6 -3 M${x+6} ${y+14} l7 -2 M${x-4} ${y-18} l5 3" stroke="#2f2a26" stroke-width="1" opacity=".35"/>
    </g>`;
  });
  $("balloons").innerHTML = s;
}
function popBalloon(n){
  const b = document.querySelector(`.balloon[data-i="${n}"]`);
  const st = document.querySelector(`.string[data-i="${n}"]`);
  if(!b) return;
  b.classList.add("popped"); st.classList.add("popped");
  const r = b.getBoundingClientRect(), stage = document.querySelector(".stage").getBoundingClientRect();
  const w = document.createElement("span");
  w.className = "pop-word"; w.textContent = "POP!";
  w.style.left = (r.left - stage.left) + "px"; w.style.top = (r.top - stage.top) + "px";
  document.querySelector(".stage").appendChild(w);
  setTimeout(()=>w.remove(), 800);
}
const POP_ORDER = [2,5,0,3,1,4];

function setLift(){
  $("rig").style.setProperty("--lift", (MAX_MISS - misses) * LIFT_STEP);
  $("lives").textContent = "🎈 × " + (MAX_MISS - misses);
}

/* ---------- sound ---------- */
let actx;
function beep(freqs, dur=.12, type="triangle"){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i*dur;
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t+dur*1.8);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur*2);
    });
  }catch(e){}
}
const sGood = () => beep([660,880]);
const sBad  = () => beep([220],.18,"sawtooth");
const sWin  = () => beep([523,659,784,1047],.13);

let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /google|samantha|microsoft/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = .8; if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- keyboard ---------- */
function buildKeyboard(){
  const rows = ["abcdefghi","jklmnopqr","stuvwxyz"];
  $("keyboard").innerHTML = rows.map(r =>
    `<div class="krow">${[...r].map(ch=>`<button class="key" data-k="${ch}" aria-label="${ch}">${ch}</button>`).join("")}</div>`
  ).join("");
  $("keyboard").addEventListener("click", e=>{
    const k = e.target.closest(".key"); if(k) guess(k.dataset.k);
  });
}
document.addEventListener("keydown", e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$("warm").classList.contains("hidden")) return;
  const k = e.key.toLowerCase();
  if(/^[a-z]$/.test(k)) guess(k);
  else if(e.key === "Enter" && done && document.activeElement !== $("nextBtn")){ e.preventDefault(); next(); }
});

/* ---------- game ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }

function renderStars(el, list){
  el.innerHTML = CARDS.map((_,i)=> `<span class="${list[i] ? "" : "off"}">⭐</span>`).join("");
}

function startGame(){
  order = shuffle(CARDS.map((_,i)=>i)); idx = 0; results = [];
  $("overlay").classList.add("hidden");
  loadRound();
}

function loadRound(){
  const c = CARDS[order[idx]];
  word = c.word; guessed = new Set(); misses = 0; done = false;
  drawBalloons(); setLift();
  $("cardImg").src = c.img;
  const card = $("card"); card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
  $("prompt").textContent = "Type the word!";
  $("word").className = "word";
  $("word").innerHTML = word.split(" ").map(part =>
    `<span class="part">${[...part].map(ch=>`<span class="slot" data-ch="${ch}"></span>`).join("")}</span>`).join("");
  document.querySelectorAll(".key").forEach(k=>{ k.className = "key"; k.disabled = false; });
  ["listenBtn","sayIt","nextBtn"].forEach(id=>$(id).classList.add("hidden"));
  renderStars($("stars"), CARDS.map((_,i)=> i < results.length ? results[i] : false));
}

function guess(ch){
  if(done || guessed.has(ch)) return;
  guessed.add(ch);
  const key = document.querySelector(`.key[data-k="${ch}"]`);
  if(word.includes(ch)){
    key.classList.add("good"); sGood();
    document.querySelectorAll(`.slot[data-ch="${ch}"]`).forEach(s=>{ s.textContent = ch; s.classList.add("shown"); });
    if([...word.replace(/ /g,"")].every(l=>guessed.has(l))) finish(true);
  }else{
    key.classList.add("bad"); key.disabled = true; sBad();
    popBalloon(POP_ORDER[misses]);
    misses++; setLift();
    if(misses >= MAX_MISS) finish(false);
  }
}

function finish(won){
  done = true;
  document.querySelectorAll(".key").forEach(k=>k.disabled = true);
  results.push(won);
  if(won){
    $("word").classList.add("won");
    $("prompt").textContent = "Great! 🎉";
    $("rig").classList.remove("bounce"); void $("rig").offsetWidth; $("rig").classList.add("bounce");
    sWin();
  }else{
    document.querySelectorAll(".slot[data-ch]").forEach(s=>{
      if(!s.textContent){ s.textContent = s.dataset.ch; s.classList.add("missed","shown"); }
    });
    $("prompt").textContent = "Oops! Here is the word:";
  }
  renderStars($("stars"), CARDS.map((_,i)=> i < results.length ? results[i] : false));
  setTimeout(()=>speak(word), 450);
  ["listenBtn","sayIt","nextBtn"].forEach(id=>$(id).classList.remove("hidden"));
  $("nextBtn").textContent = idx === CARDS.length-1 ? "Finish 🏁" : "Next ➡️";
  $("nextBtn").focus({preventScroll:true});
}

function next(){
  if(!done) return;
  done = false;
  idx++;
  if(idx >= CARDS.length){ showEnd(); return; }
  loadRound();
}

function showEnd(){
  const n = results.filter(Boolean).length;
  renderStars($("endStars"), results);
  $("endText").textContent = `You guessed ${n} of ${CARDS.length} words!`;
  $("overlay").classList.remove("hidden");
  sWin(); speak(n >= CARDS.length - 2 ? "Well done! Great job!" : "Well done! Let's play again!");
  $("againBtn").focus();
}

$("listenBtn").onclick = () => speak(word);
$("nextBtn").onclick = next;
$("againBtn").onclick = startGame;
$("soundBtn").onclick = () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn ? "🔔" : "🔕";
};

/* ---------- warm-up ---------- */
let listenRun = 0;
function buildWarmup(){
  $("wgrid").innerHTML = CARDS.map((c,i)=>
    `<button class="wcard frame" data-i="${i}"><img src="${c.img}" alt=""><span>${c.word}</span></button>`).join("");
  $("wgrid").addEventListener("click", e=>{
    const b = e.target.closest(".wcard"); if(!b) return;
    listenRun++; highlight(+b.dataset.i); speak(CARDS[+b.dataset.i].word);
  });
}
function highlight(i){
  document.querySelectorAll(".wcard").forEach(c=>c.classList.toggle("playing", +c.dataset.i === i));
}
function speakAsync(text){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)) return setTimeout(res,900);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .8; if(voice) u.voice = voice;
    u.onend = u.onerror = res; speechSynthesis.speak(u);
    setTimeout(res, 4000);
  });
}
async function listenAll(){
  const run = ++listenRun;
  for(let i=0;i<CARDS.length;i++){
    if(run !== listenRun) return;
    highlight(i);
    document.querySelector(`.wcard[data-i="${i}"]`).scrollIntoView({block:"nearest",behavior:"smooth"});
    await speakAsync(CARDS[i].word);
    await new Promise(r=>setTimeout(r,1300));   // pause for the kids to repeat
  }
  if(run === listenRun) highlight(-1);
}
function showWarmup(){
  $("overlay").classList.add("hidden");
  $("warm").classList.remove("hidden"); highlight(-1); $("warm").scrollTop = 0;
}
function hideWarmup(){
  listenRun++; if("speechSynthesis" in window) speechSynthesis.cancel();
  $("warm").classList.add("hidden"); highlight(-1);
}
$("listenAllBtn").onclick = listenAll;
$("playBtn").onclick = () => { hideWarmup(); startGame(); };
$("reviewBtn").onclick = showWarmup;
$("wordsBtn").onclick = () => {
  if(results.length && !confirm("Look at the words? The game will start again.")) return;
  showWarmup();
};

buildKeyboard();
buildWarmup();
</script>
</body>
</html>
